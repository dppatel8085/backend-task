
name: Backend CI-CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t devraj8085/backend-task:latest .

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image to Docker Hub
        run: docker push devraj8085/backend-task:latest

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::868150783832:role/GitHubActionsDeployRole
          aws-region: eu-north-1

      - name: Deploy on EC2 via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-07dd1c73d105904f2" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "sudo docker pull devraj8085/backend-task:latest",
              "sudo docker stop backend-task-container || true",
              "sudo docker rm backend-task-container || true",
              "sudo docker run -d --name backend-task-container --restart unless-stopped -p 3000:3000 devraj8085/backend-task:latest",
              "sudo docker ps"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "i-07dd1c73d105904f2"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-07dd1c73d105904f2" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json
